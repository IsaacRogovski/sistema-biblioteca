<h1>Minha Biblioteca</h1>
<h2>Login</h2>
<form (ngSubmit)="Entrar()">
  <div>
    <label>Usuário:</label>
    <input 
      type="text" 
      [(ngModel)]="usuario" 
      name="usuario"
      placeholder="Digite seu usuário"
    >
  </div>
  <div>
    <label>Senha:</label>
    <input 
      type="password" 
      [(ngModel)]="senha" 
      name="senha"
      placeholder="Digite sua senha"
    >
  </div>

  <button type="submit">Entrar</button>

</form>
