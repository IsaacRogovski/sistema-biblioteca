<div class="avisos">
  @for (aviso of toast.avisos(); track aviso.id) {
    <div
      class="aviso"
      [class.sucesso]="aviso.tipo === 'sucesso'"
      [class.erro]="aviso.tipo === 'erro'"
      [class.info]="aviso.tipo === 'info'"
      [attr.role]="aviso.tipo === 'erro' ? 'alert' : 'status'"
    >
      <p>{{ aviso.texto }}</p>
      <button type="button" class="fechar" aria-label="Fechar aviso" (click)="toast.fechar(aviso.id)">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  }
</div>
